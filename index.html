<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תזכורות</title>
<meta name="description" content="אפליקציית תזכורות בעברית: תזכורות חוזרות, ימי הולדת, נודניק, לוח שנה עברי והתראות שקופצות גם כשהאפליקציה סגורה.">
<meta name="theme-color" content="#f4f5fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תזכורות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="תזכורות">
<meta property="og:description" content="תזכורות בעברית עם התראות, ימי הולדת ולוח שנה עברי.">
<meta property="og:image" content="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=JSON.parse(localStorage.getItem('tz-theme')||'null');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="app">
  <header class="top">
    <img src="logo.png" class="logo" alt="">
    <div class="grow"><h1>תזכורות</h1><div id="today-label" class="sub"></div></div>
    <button id="btn-install" class="pill install" hidden></button>
    <button id="btn-search" class="icon-btn" aria-label="חיפוש"></button>
    <button id="btn-settings" class="icon-btn" aria-label="הגדרות"></button>
  </header>
  <div id="notif-banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<button id="mic" class="fab mic" aria-label="הוספה בקול"></button>
<button id="fab" class="fab" aria-label="תזכורת חדשה"></button>
<nav id="tabs" class="tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="schedule.js"></script>
<script src="store.js"></script>
<script src="sounds.js"></script>
<script src="holidays.js"></script>
<script src="app.js"></script>
<script src="voice-note.js" defer></script>
</body>
</html>
